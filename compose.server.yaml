services:
  tunnel:
    build: tunnel
    container_name: tunnel
    cap_add:
      - NET_ADMIN

  server:
    build: server
    container_name: server
    ports:
      - "8000:8000"
    restart: unless-stopped
    network_mode: "service:tunnel"
  
  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile
    restart: unless-stopped
